# Override per deploy da Docker Hub (senza build locale).
# Uso: docker compose -f docker-compose.yml -f docker-compose.hub.yml pull
#      docker compose -f docker-compose.yml -f docker-compose.hub.yml up -d --no-build
#
# Namespace predefinito: utente Docker Hub loggato (es. cybercecco).
# Sovrascrivibile con DOCKERHUB_NAMESPACE in .env

services:
  api:
    image: ${DOCKERHUB_NAMESPACE}/mail-exchange-api:${MAIL_EXCHANGE_IMAGE_TAG:-latest}

  frontend:
    image: ${DOCKERHUB_NAMESPACE}/mail-exchange-frontend:${MAIL_EXCHANGE_IMAGE_TAG:-latest}

  caddy:
    image: ${DOCKERHUB_NAMESPACE}/mail-exchange-caddy:${MAIL_EXCHANGE_IMAGE_TAG:-latest}

  postfix:
    image: ${DOCKERHUB_NAMESPACE}/mail-exchange-postfix:${MAIL_EXCHANGE_IMAGE_TAG:-latest}

  amavis:
    image: ${DOCKERHUB_NAMESPACE}/mail-exchange-amavis:${MAIL_EXCHANGE_IMAGE_TAG:-latest}

  opendkim:
    image: ${DOCKERHUB_NAMESPACE}/mail-exchange-opendkim:${MAIL_EXCHANGE_IMAGE_TAG:-latest}
