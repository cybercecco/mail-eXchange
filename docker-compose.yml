# Config runtime Postfix/Amavis/SpamAssassin (host: ./config o /opt/mail-exchange/config)
x-mail-config-volume: &mail-config-volume
  ${MAIL_CONFIG_DIR:-./config}:/mail-exchange-config

# DNS di default; sovrascritti da docker-dns.override.yml generato dalle impostazioni
x-app-dns: &app-dns
  dns:
    - ${DOCKER_DNS_1:-208.67.222.222}
    - ${DOCKER_DNS_2:-208.67.220.220}

x-app-tz: &app-tz
  environment:
    TZ: Europe/Rome

services:
  api:
    <<: [*app-dns, *app-tz]
    image: ${DOCKERHUB_NAMESPACE:-cybercecco}/mail-exchange-api:${MAIL_EXCHANGE_IMAGE_TAG:-latest}
    container_name: mx-api
    environment:
      - TZ=Europe/Rome
      - API_PORT=8000
      - DATA_DIR=/data
      - MAIL_CONFIG_DIR=/mail-exchange-config
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - POSTFIX_HOSTNAME=${POSTFIX_HOSTNAME}
      - CADDY_DOMAIN=${CADDY_DOMAIN:-}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - POSTFIX_SMTP_TLS=${POSTFIX_SMTP_TLS:-false}
      - PUBLIC_HOSTNAME=${PUBLIC_HOSTNAME:-}
      - PUBLIC_IPV4=${PUBLIC_IPV4:-}
      - DKIM_SELECTOR=${DKIM_SELECTOR:-mail}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-480}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MFA_ISSUER=${MFA_ISSUER:-Mail Exchange}
      - SYNC_TLS_VERIFY=${SYNC_TLS_VERIFY:-true}
      - SYNC_HTTPS_PORT=${SYNC_HTTPS_PORT:-60443}
      - OPENDKIM_KEYS_DIR=/etc/opendkim/keys
      - COMPOSE_PROJECT_DIR=/compose
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - mail-data:/data
      - *mail-config-volume
      - dkim-keys:/etc/opendkim/keys
      # Riavvio servizi da pannello admin: socket Docker (ro) + CLI nel container api
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Compose del progetto (read-only) per applicare DNS/Caddy dopo impostazioni pubbliche
      - ${COMPOSE_HOST_DIR:-.}:/compose:ro
    networks:
      - mxnet
    restart: unless-stopped

  frontend:
    <<: [*app-dns, *app-tz]
    image: ${DOCKERHUB_NAMESPACE:-cybercecco}/mail-exchange-frontend:${MAIL_EXCHANGE_IMAGE_TAG:-latest}
    container_name: mx-frontend
    depends_on:
      - api
    networks:
      - mxnet
    restart: unless-stopped

  caddy:
    <<: [*app-dns, *app-tz]
    image: ${DOCKERHUB_NAMESPACE:-cybercecco}/mail-exchange-caddy:${MAIL_EXCHANGE_IMAGE_TAG:-latest}
    container_name: mx-caddy
    environment:
      - TZ=Europe/Rome
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    command: ["run", "--config", "/mail-exchange-data/generated/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "${CADDY_HTTP_PORT:-60080}:80"
      - "${CADDY_HTTPS_PORT:-60443}:443"
    volumes:
      - mail-data:/mail-exchange-data:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    networks:
      - mxnet
    restart: unless-stopped

  postfix:
    <<: [*app-dns, *app-tz]
    image: ${DOCKERHUB_NAMESPACE:-cybercecco}/mail-exchange-postfix:${MAIL_EXCHANGE_IMAGE_TAG:-latest}
    container_name: mx-postfix
    environment:
      - TZ=Europe/Rome
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - MYHOSTNAME=${POSTFIX_HOSTNAME}
      - MYNETWORKS=${MYNETWORKS}
    ports:
      - "${SMTP_PUBLISHED_PORT:-2525}:25"
      - "${SUBMISSION_PUBLISHED_PORT:-1587}:587"
    volumes:
      - mail-data:/data
      - *mail-config-volume
      - postfix-spool:/var/spool/postfix
      # ACME certs from Caddy (read-only) for inbound smtpd STARTTLS
      - caddy-data:/caddy-data:ro
    depends_on:
      - api
      - amavis
      - opendkim
      - caddy
    networks:
      - mxnet
    restart: unless-stopped

  amavis:
    <<: [*app-dns, *app-tz]
    image: ${DOCKERHUB_NAMESPACE:-cybercecco}/mail-exchange-amavis:${MAIL_EXCHANGE_IMAGE_TAG:-latest}
    container_name: mx-amavis
    environment:
      - TZ=Europe/Rome
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - POSTFIX_HOSTNAME=${POSTFIX_HOSTNAME}
    volumes:
      - mail-data:/data
      - *mail-config-volume
    depends_on:
      clamav:
        condition: service_healthy
    networks:
      - mxnet
    restart: unless-stopped

  clamav:
    <<: [*app-dns, *app-tz]
    image: clamav/clamav:stable
    container_name: mx-clamav
    environment:
      - TZ=Europe/Rome
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - mxnet
    restart: unless-stopped

  opendkim:
    <<: [*app-dns, *app-tz]
    image: ${DOCKERHUB_NAMESPACE:-cybercecco}/mail-exchange-opendkim:${MAIL_EXCHANGE_IMAGE_TAG:-latest}
    container_name: mx-opendkim
    environment:
      - TZ=Europe/Rome
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - DKIM_SELECTOR=${DKIM_SELECTOR}
    volumes:
      - dkim-keys:/etc/opendkim/keys
      - mail-data:/data
    networks:
      - mxnet
    restart: unless-stopped

volumes:
  mail-data:
  postfix-spool:
  dkim-keys:
  caddy-data:
  caddy-config:

networks:
  mxnet:
    driver: bridge
